<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniAGuard — Phoenix Dominion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;color:#e5e4e2;font-family:'Inter','Segoe UI',sans-serif;overflow:hidden;height:100vh;margin:0}
        #bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
        .grid-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,0.005) 0px,rgba(255,255,255,0.005) 1px,transparent 1px,transparent 4px),repeating-linear-gradient(90deg,rgba(255,255,255,0.005) 0px,rgba(255,255,255,0.005) 1px,transparent 1px,transparent 4px);pointer-events:none}
        .glow{position:fixed;top:50%;left:50%;width:60vw;height:60vh;transform:translate(-50%,-50%);z-index:0;background:radial-gradient(ellipse at center,rgba(212,175,55,0.03) 0%,rgba(0,0,0,0) 70%);animation:pulse 6s ease-in-out infinite;pointer-events:none}
        @keyframes pulse{0%,100%{opacity:0.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
        .ui-overlay{position:relative;z-index:10;display:flex;flex-direction:column;justify-content:space-between;height:100vh;padding:1.5rem}
        .nav{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.03);flex-wrap:wrap;gap:0.5rem;pointer-events:auto}
        .nav .logo{font-size:1.2rem;font-weight:300;letter-spacing:8px;color:#e5e4e2}
        .nav .logo span{color:#00d4ff;font-weight:600}
        .nav .links{display:flex;gap:1.5rem;flex-wrap:wrap}
        .nav .links a{color:#404040;text-decoration:none;font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;transition:color 0.3s}
        .nav .links a:hover{color:#00d4ff}
        .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
        .hero h1{font-size:3.5rem;font-weight:200;letter-spacing:16px;color:#e5e4e2;margin-bottom:0.5rem;text-shadow:0 0 60px rgba(212,175,55,0.05)}
        .hero .tagline{color:#404040;font-size:0.8rem;max-width:500px;margin:0 auto 1.5rem;letter-spacing:3px;font-weight:300;line-height:1.6}
        .hero .badge{display:inline-block;border:1px solid rgba(255,255,255,0.04);padding:0.3rem 1.5rem;border-radius:100px;font-size:0.45rem;letter-spacing:5px;color:#404040;background:rgba(255,255,255,0.01);margin-bottom:1.5rem;text-transform:uppercase}
        .btn-group{display:flex;gap:0.6rem;flex-wrap:wrap;justify-content:center;pointer-events:auto}
        .btn{padding:0.6rem 1.8rem;border-radius:100px;font-weight:400;letter-spacing:3px;text-decoration:none;transition:0.3s;border:none;cursor:pointer;font-size:0.65rem;text-transform:uppercase}
        .btn-primary{background:rgba(00d4ff,0.08);border:1px solid rgba(00d4ff,0.12);color:#00d4ff}
        .btn-primary:hover{background:rgba(00d4ff,0.15);transform:translateY(-2px)}
        .btn-glass{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);color:#e5e4e2}
        .btn-glass:hover{background:rgba(255,255,255,0.04);transform:translateY(-2px)}
        .footer{text-align:center;padding:0.5rem 0;color:#202020;font-size:0.4rem;letter-spacing:4px;border-top:1px solid rgba(255,255,255,0.02);pointer-events:auto}
        .avatar-container{position:fixed;bottom:80px;right:15px;z-index:100;display:flex;gap:0.4rem;flex-direction:column;pointer-events:auto}
        .avatar{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,0.04);background:rgba(10,10,15,0.6);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;transition:0.3s;animation:float 4s ease-in-out infinite}
        .avatar:hover{border-color:rgba(00d4ff,0.15);transform:scale(1.05)}
        .avatar:nth-child(2){animation-delay:0.6s}
        .avatar:nth-child(3){animation-delay:1.2s}
        .avatar:nth-child(4){animation-delay:1.8s}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .chat-widget{position:fixed;bottom:20px;right:15px;z-index:100;background:rgba(10,10,15,0.6);border:1px solid rgba(255,255,255,0.02);border-radius:12px;padding:0.4rem 1rem;backdrop-filter:blur(20px);cursor:pointer;transition:0.3s;pointer-events:auto}
        .chat-widget:hover{border-color:rgba(00d4ff,0.05)}
        .chat-widget .chat-icon{font-size:0.9rem;display:inline-block;margin-right:0.5rem;opacity:0.4}
        .chat-widget .chat-text{color:#404040;font-size:0.6rem}
        .chat-widget .chat-text strong{color:#00d4ff;font-weight:400}
        @media(max-width:768px){.hero h1{font-size:2rem;letter-spacing:8px}.avatar-container{right:10px}.avatar{width:38px;height:38px;font-size:1rem}}
    </style>
</head>
<body>
<div id="bg"></div>
<div class="grid-overlay"></div>
<div class="glow"></div>
<div class="ui-overlay">
    <div class="nav">
        <div class="logo">🏛️ <span>OmniAGuard_SHORT</span>.</div>
        <div class="links">
            <a href="/">Home</a>
            <a href="https://franciscoholdingsinc.com/dashboard.html">Dashboard</a>
        </div>
    </div>
    <div class="hero">
        <div class="badge">⚡ FREE ACCESS · Cybersecurity</div>
        <h1>OmniAGuard</h1>
        <p class="tagline">Agentic AI cybersecurity — protect your empire.</p>
        <div class="btn-group">
            <a href="https://franciscoholdingsinc.com/dashboard.html" class="btn btn-glass">Enter the Empire</a>
            <a href="#free" class="btn btn-primary">Free Access</a>
        </div>
    </div>
    <div class="footer">© 2026 <span style="color:#404040;">Phoenix Dominion</span> — Francisco Holdings Inc.</div>
</div>
<div class="avatar-container">
    <div class="avatar" title="PrimeDox" onclick="window.location.href='https://zprimedoxaihq.com'">🧠</div>
    <div class="avatar" title="SoulStack" onclick="alert('🏛️ SoulStack: Empire orchestrator active.')">🏛️</div>
    <div class="avatar" title="Vigilax" onclick="alert('🔬 Vigilax: All domains secure. 0 threats.')">🔬</div>
    <div class="avatar" title="OmniAGuard" onclick="alert('🛡️ OmniAGuard: 24/7 protection active.')">🛡️</div>
</div>
<div class="chat-widget" onclick="window.location.href='https://franciscoholdingsinc.com/dashboard.html'">
    <span class="chat-icon">💬</span>
    <span class="chat-text">Talk to <strong>PrimeDox</strong> AI</span>
</div>
<script>
// ─── 3D ROTATING SKYSCRAPER ───
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a0f);
const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,3,10);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.getElementById('bg').appendChild(renderer.domElement);
const ambient=new THREE.AmbientLight(0x222244,0.5);scene.add(ambient);
const dirLight=new THREE.DirectionalLight(0xd4af37,1);dirLight.position.set(5,10,5);scene.add(dirLight);
const dirLight2=new THREE.DirectionalLight(0x88ccff,0.4);dirLight2.position.set(-5,5,-5);scene.add(dirLight2);
const towerGroup=new THREE.Group();
const glassMat=new THREE.MeshPhysicalMaterial({color:0x88ccff,metalness:0.3,roughness:0.02,transparent:true,opacity:0.08,clearcoat:0.8,clearcoatRoughness:0.02});
const tower=new THREE.Mesh(new THREE.BoxGeometry(0.8,5.0,0.8),glassMat);tower.position.y=2.5;towerGroup.add(tower);
const mirrorMat=new THREE.MeshPhysicalMaterial({color:0xd4af37,metalness:0.95,roughness:0.01});const mirror=new THREE.Mesh(new THREE.BoxGeometry(0.5,4.8,0.5),mirrorMat);mirror.position.y=2.5;towerGroup.add(mirror);
for(let i=0;i<100;i++){const f=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.015,0.85),new THREE.MeshPhysicalMaterial({color:i%2===0?0x88ccff:0xd4af37,metalness:0.3,roughness:0.05,transparent:true,opacity:0.08}));f.position.y=i*0.05+0.05;towerGroup.add(f)}
for(let i=0;i<20;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.2,0.015),new THREE.MeshPhysicalMaterial({color:0x88ccff,metalness:0.2,roughness:0.02,transparent:true,opacity:0.02}));const a=(i/20)*Math.PI*2;p.position.set(Math.cos(a)*0.42,i*0.25+0.1,Math.sin(a)*0.42);towerGroup.add(p)}
for(let i=0;i<5;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(1.1+(i*0.1),0.01,16,60),new THREE.MeshPhysicalMaterial({color:0xd4af37,metalness:0.9,roughness:0.02,transparent:true,opacity:0.05}));r.rotation.x=Math.PI/2;r.position.y=i*1.0+0.5;towerGroup.add(r)}
scene.add(towerGroup);
const pGeo=new THREE.BufferGeometry();const pPos=new Float32Array(300*3);for(let i=0;i<300*3;i++)pPos[i]=(Math.random()-0.5)*16;pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));const pMat=new THREE.PointsMaterial({color:0xd4af37,size:0.015,transparent:true,opacity:0.08});const particles=new THREE.Points(pGeo,pMat);scene.add(particles);
let mx=0,my=0;document.addEventListener('mousemove',(e)=>{mx=(e.clientX/window.innerWidth)*2-1;my=-(e.clientY/window.innerHeight)*2+1});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
function animate(){requestAnimationFrame(animate);towerGroup.rotation.y+=0.003;particles.rotation.y+=0.0003;towerGroup.rotation.x+=(my*0.03-towerGroup.rotation.x)*0.01;towerGroup.rotation.z+=(-mx*0.03-towerGroup.rotation.z)*0.01;renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
